<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MAKER® — 张清 · 职业形象转盘</title>
<meta name="description" content="张清：11 年软件开发，6 个职业阶段。拖动转盘，点击人物查看每个阶段的档案收据。">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="mode-ring">
<div class="screen" id="screen">
  <div id="stage" aria-label="职业形象转盘，拖动旋转，点击正面人物查看档案"></div>

  <!-- 顶栏：实时时钟 + 信号 / LOGO / 档案计数（对齐 NOWHERE 顶栏） -->
  <header class="topbar">
    <div class="tb-left">
      <span id="clock">--:--</span>
      <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="low">SHENZHEN</span>
    </div>
    <div class="tb-logo">MAKER<sup>®</sup></div>
    <div class="tb-right">
      <div class="batt-wrap" aria-hidden="true">
        <span class="batt"><i></i></span><span>11&nbsp;YRS</span>
      </div>
      <button class="bag-btn" id="archiveBtn" type="button">ARCHIVE&nbsp;(0)</button>
    </div>
  </header>

  <div class="qr" id="qr" aria-hidden="true"></div>

  <!-- 侧边视图切换 -->
  <button class="looks-pill side-ui" id="stagesPill" type="button">STAGES</button>
  <div class="view-toggle side-ui" role="group" aria-label="视图切换">
    <button type="button" id="tglRing" class="on">RING</button>
    <button type="button" id="tglGrid">GRID</button>
  </div>

  <!-- 详情态 UI -->
  <div class="detail-title" id="detailTitle"><span class="dnum">01.</span><span class="dname">CAMPUS</span></div>
  <div class="hint" id="hint">点人物身上的圆点，查看这个阶段的关键词</div>
  <button class="close-btn" id="closeBtn" type="button" aria-label="关闭档案">✕</button>
  <div class="receipt-wrap" id="receiptWrap" aria-hidden="true">
    <div class="receipt-ghost" aria-hidden="true"></div>
    <aside class="receipt" id="receipt" aria-label="阶段档案收据"></aside>
  </div>

  <!-- 底部信息条 -->
  <div class="bottombar">
    <div class="meta">
      <div class="meta-row">
        <span class="cnt-clip"><span class="cnt-num" id="cntNum">01</span></span><span>&nbsp;/&nbsp;06</span>
        <button class="play-btn" id="playBtn" type="button" aria-label="播放 / 暂停"></button>
      </div>
      <div class="look-name" id="lookName">CAMPUS</div>
      <div class="look-sub" id="lookSub">校园 · 2012–2016</div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="shop-block">
      <span>VIEW ARCHIVE</span>
      <button class="plus-btn" id="plusBtn" type="button" aria-label="查看当前阶段档案">+</button>
    </div>
  </div>

  <div id="cursor" aria-hidden="true">DRAG</div>
</div>

<footer class="foot">
  © 2026 张清 · MAKER — 内容基于个人经历记录整理 ·
  <a href="https://github.com/zqingdut">GitHub zqingdut</a> ·
  公众号 OoneAI
</footer>

<script src="main.js?v=4"></script>
</body>
</html>
