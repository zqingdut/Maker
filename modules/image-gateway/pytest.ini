[pytest]
testpaths = tests
# -p no:cacheprovider: the suite must not write anything, including .pytest_cache.
# That keeps it runnable in a read-only sandbox.
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning

# The suite touches no filesystem paths except through the `work_dir` fixture,
# which the gateway tests need because storing what it fetches is the thing under
# test. Everything else runs without disk or network access, so the suite works in
# a read-only sandbox.
#
# `work_dir` deliberately does NOT use pytest's `tmp_path`: creating anything under
# the system temp directory is refused in this sandbox, and deleting is gated
# behind an interactive approval, so a self-cleaning fixture leaks instead of
# failing. It derives a stable path from the test id and never deletes -- which is
# why tests there assert deltas rather than absolute counts.
#
# If pytest hangs before printing anything, a third-party plugin's autoload is
# stalling (observed under heavy machine load). Workaround:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest
